name: Syntax check & tests

# Apps Script has no build step and no package manager, so the syntax-check
# job is intentionally minimal: it only confirms every .gs file is valid
# JavaScript before it gets pasted into the Apps Script editor.
#
# The test-suite job actually RUNS tests/*.gs — as of the 2026-09-24 test
# harness (tests/harness/run-node-tests.js), the suite loads app/*.gs and
# tests/*.gs into a Node vm context seeded with Apps Script service mocks
# (tests/mocks/apps-script-globals.js) and calls the same runAllTests()
# the Apps Script editor uses, so this now genuinely exercises the suite
# on every push/PR instead of only when someone runs it manually in the
# editor. See CLAUDE.md and tests/RunAll.gs for how the harness works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .gs files parse as valid JavaScript
        run: |
          status=0
          for f in app/*.gs tests/*.gs; do
            echo "::group::$f"
            # --input-type=commonjs + stdin: node's extension-based module
            # detection rejects the unrecognized ".gs" extension outright
            # (ERR_UNKNOWN_FILE_EXTENSION) before it ever looks at syntax.
            # Piping via stdin skips that detection entirely.
            if ! error_output=$(node --check --input-type=commonjs < "$f" 2>&1); then
              echo "$error_output"
              echo "::error file=$f::$error_output"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AutoTrash test suite (Node harness)
        run: npm test
